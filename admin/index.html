<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — DIGITAL CNC</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0d0b09;--panel:#17120e;--gold:#d6a94c;--cream:#f5ead8;--muted:#b8a994;--line:#3b2b1a}*{box-sizing:border-box}body{margin:0;background:#0d0b09;color:var(--cream);font-family:'Noto Sans Bengali',sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d0b0eee;backdrop-filter:blur(10px);z-index:5}.bar{max-width:1050px;margin:auto;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--gold)}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.gold{background:var(--gold);color:#181008}.dark{background:#21170d;color:#fff;border:1px solid #604621}.danger{background:#7d2525;color:#fff}.panel{background:#17120e;border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}.login{max-width:440px;margin:70px auto}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;font-size:14px;color:#dbcab4;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #4b3620;background:#0f0c09;color:#fff;font:inherit}.field textarea{min-height:95px;resize:vertical}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.msg{padding:12px;border-radius:10px;background:#1b291c;color:#bfe8c4;margin:10px 0;display:none}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tab{white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#120e0b}.thumb{height:160px;border-radius:10px;overflow:hidden;background:#0d0b09;margin-bottom:10px}.thumb img{width:100%;height:100%;object-fit:cover}.small{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:700px){.row,.cards{grid-template-columns:1fr}.bar{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div id="loginView" class="wrap login"><div class="panel"><h1>🔐 Admin Panel</h1><p class="small">DIGITAL CNC WOOD DESIGN HOUSE-এর তথ্য ও ছবি পরিচালনা করুন।</p><div id="loginMsg" class="msg"></div><div class="field"><label>ইমেইল</label><input id="email" type="email" placeholder="আপনার admin email"></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" placeholder="পাসওয়ার্ড"></div><button class="gold" id="loginBtn">লগইন করুন</button></div></div><div id="app" class="hidden"><header class="top"><div class="bar"><div class="brand">DIGITAL CNC — ADMIN</div><div><a href="../" target="_blank"><button class="dark">🌐 সাইট দেখুন</button></a> <button class="dark" id="logout">লগআউট</button></div></div></header><main class="wrap"><div id="msg" class="msg"></div><div class="tabs"><button class="gold tab" onclick="showTab('info')">🏠 ব্যবসার তথ্য</button><button class="dark tab" onclick="showTab('services')">🛠️ সেবা</button><button class="dark tab" onclick="showTab('gallery')">🖼️ গ্যালারি</button></div><section id="info" class="panel"><div class="head"><div><h2>ব্যবসার তথ্য পরিবর্তন</h2><div class="small">এখানে পরিবর্তন করলে Public Page-এও পরিবর্তন হবে।</div></div><button class="gold" id="saveInfo">💾 সংরক্ষণ করুন</button></div><div class="row"><div class="field"><label>ব্যবসার নাম</label><input id="business_name"></div><div class="field"><label>শুরুতে দেখাবে</label><input id="greeting"></div><div class="field"><label>Welcome লেখা</label><textarea id="welcome_text"></textarea></div><div class="field"><label>মূল Tagline</label><input id="tagline"></div><div class="field"><label>ফিনিশিং Tagline</label><input id="finishing_text"></div><div class="field"><label>মালিক</label><input id="owner"></div><div class="field"><label>ফোন ১</label><input id="phone1"></div><div class="field"><label>ফোন ২</label><input id="phone2"></div><div class="field"><label>WhatsApp নম্বর</label><input id="whatsapp" placeholder="যেমন 8801881246230"></div><div class="field"><label>IMO link</label><input id="imo"></div><div class="field"><label>Google Maps link</label><input id="maps_url"></div><div class="field"><label>Facebook Page link</label><input id="facebook_url"></div><div class="field" style="grid-column:1/-1"><label>ঠিকানা</label><textarea id="address"></textarea></div></div></section><section id="services" class="panel hidden"><div class="head"><div><h2>সেবা পরিচালনা</h2><div class="small">নতুন সেবা যোগ, পরিবর্তন বা মুছে ফেলুন।</div></div><button class="gold" onclick="newService()">＋ নতুন সেবা</button></div><div id="serviceList" class="cards"></div></section><section id="gallery" class="panel hidden"><div class="head"><div><h2>ছবির গ্যালারি</h2><div class="small">Facebook-এর মতো নতুন ছবি যোগ ও মুছে ফেলতে পারবেন।</div></div><label class="gold" style="display:inline-block;padding:11px 15px;border-radius:10px;cursor:pointer">＋ নতুন ছবি <input id="photoInput" type="file" accept="image/*" multiple hidden></label></div><div id="galleryList" class="cards"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb,infoId;const $=id=>document.getElementById(id);function notice(t,err=false){const m=$('msg');m.textContent=t;m.style.display='block';m.style.background=err?'#3a1818':'#1b291c';setTimeout(()=>m.style.display='none',3500)}function loginNotice(t){$('loginMsg').textContent=t;$('loginMsg').style.display='block'}function configured(){return window.CNC_CONFIG&&!CNC_CONFIG.SUPABASE_URL.includes('YOUR-')&&!CNC_CONFIG.SUPABASE_ANON_KEY.includes('YOUR_')}
async function boot(){if(!configured()){loginNotice('প্রথমে config.js-এ Supabase URL ও anon key বসাতে হবে।');return}sb=supabase.createClient(CNC_CONFIG.SUPABASE_URL,CNC_CONFIG.SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(session)openApp();sb.auth.onAuthStateChange((_e,s)=>{if(s)openApp();else{ $('app').classList.add('hidden');$('loginView').classList.remove('hidden')}})}
async function doLogin(){if(!configured())return loginNotice('config.js সেটআপ করা হয়নি।');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)loginNotice('লগইন হয়নি: '+error.message)}$('loginBtn').onclick=doLogin;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('logout').onclick=()=>sb.auth.signOut();
function openApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');loadInfo();loadServices();loadGallery()}function showTab(id){['info','services','gallery'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='services')loadServices();if(id==='gallery')loadGallery()}
async function loadInfo(){let {data,error}=await sb.from('business_info').select('*').limit(1).maybeSingle();if(error)return notice(error.message,true);if(!data){const r=await sb.from('business_info').insert({}).select().single();data=r.data}infoId=data.id;['business_name','greeting','welcome_text','tagline','finishing_text','owner','phone1','phone2','whatsapp','imo','maps_url','facebook_url','address'].forEach(k=>$(k).value=data[k]||'')}
$('saveInfo').onclick=async()=>{const obj={};['business_name','greeting','welcome_text','tagline','finishing_text','owner','phone1','phone2','whatsapp','imo','maps_url','facebook_url','address'].forEach(k=>obj[k]=$(k).value);obj.updated_at=new Date().toISOString();const {error}=await sb.from('business_info').update(obj).eq('id',infoId);notice(error?'সংরক্ষণ হয়নি: '+error.message:'তথ্য সফলভাবে সংরক্ষণ হয়েছে।',!!error)};
async function loadServices(){const {data,error}=await sb.from('services').select('*').order('sort_order');if(error)return notice(error.message,true);$('serviceList').innerHTML=(data||[]).map(x=>`<div class="item"><div style="font-size:28px">${x.icon||'✦'}</div><h3>${x.title}</h3><div class="small">${x.description||''}</div><div class="actions"><button class="dark" onclick="editService('${x.id}')">✏️ পরিবর্তন</button><button class="danger" onclick="deleteService('${x.id}')">🗑️ মুছুন</button></div></div>`).join('')||'<div class="small">কোনো সেবা নেই।</div>'}
async function newService(existing){const title=prompt('সেবার নাম লিখুন:',existing?.title||'');if(!title)return;const description=prompt('সেবার সংক্ষিপ্ত বিবরণ:',existing?.description||'');const icon=prompt('আইকন/চিহ্ন:',existing?.icon||'✦');const sort=Number(prompt('ক্রম নম্বর:',existing?.sort_order||0));let q=existing?sb.from('services').update({title,description,icon,sort_order:sort}).eq('id',existing.id):sb.from('services').insert({title,description,icon,sort_order:sort});const {error}=await q;if(error)notice(error.message,true);else{notice('সেবা সংরক্ষণ হয়েছে।');loadServices()}}function editService(id){sb.from('services').select('*').eq('id',id).single().then(r=>newService(r.data))}async function deleteService(id){if(!confirm('এই সেবাটি মুছে ফেলবেন?'))return;const {error}=await sb.from('services').delete().eq('id',id);notice(error?error.message:'সেবা মুছে ফেলা হয়েছে।',!!error);loadServices()}
$('photoInput').onchange=async e=>{for(const file of [...e.target.files]){const ext=file.name.split('.').pop().toLowerCase();const path=`${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('gallery').upload(path,file,{upsert:false});if(up.error){notice('ছবি upload হয়নি: '+up.error.message,true);continue}const {data:url}=sb.storage.from('gallery').getPublicUrl(path);const title=prompt('ছবির নাম:',file.name.replace(/\.[^.]+$/,''))||'আমাদের কাজ';const category=prompt('ক্যাটাগরি:', 'অন্যান্য')||'অন্যান্য';const ins=await sb.from('gallery').insert({title,category,image_url:url.publicUrl,storage_path:path,sort_order:0});if(ins.error){await sb.storage.from('gallery').remove([path]);notice(ins.error.message,true)}}e.target.value='';notice('ছবি যোগ করা হয়েছে।');loadGallery()}
async function loadGallery(){const {data,error}=await sb.from('gallery').select('*').order('created_at',{ascending:false});if(error)return notice(error.message,true);$('galleryList').innerHTML=(data||[]).map(x=>`<div class="item"><div class="thumb"><img src="${x.image_url}" alt=""></div><b>${x.title}</b><div class="small">${x.category}</div><div class="actions"><button class="danger" onclick="deletePhoto('${x.id}','${x.storage_path.replace(/'/g,"\\'")}')">🗑️ ছবি মুছুন</button></div></div>`).join('')||'<div class="small">এখনও কোনো ছবি নেই।</div>'}async function deletePhoto(id,path){if(!confirm('এই ছবিটি স্থায়ীভাবে মুছে ফেলবেন?'))return;const a=await sb.storage.from('gallery').remove([path]);const {error}=await sb.from('gallery').delete().eq('id',id);notice(error?error.message:'ছবি মুছে ফেলা হয়েছে।',!!error);loadGallery()}boot();
</script></body></html>

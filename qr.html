<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code তৈরি — DIGITAL CNC</title><style>body{margin:0;background:#120d08;color:#f7ead5;font-family:Arial,'Noto Sans Bengali',sans-serif}.wrap{max-width:700px;margin:auto;padding:24px}.box{background:#1c140d;border:1px solid #4c351e;border-radius:20px;padding:24px}.gold{color:#e0b45b}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #65471f;background:#0d0906;color:white;font-size:16px;margin:8px 0 14px}button{padding:13px 18px;border:0;border-radius:12px;background:#e0b45b;color:#1a1008;font-weight:800;cursor:pointer}.qr{margin:22px auto;padding:16px;background:white;width:max-content;min-height:256px;display:flex;align-items:center;justify-content:center}.note{color:#bfae97;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}a{color:#e0b45b}</style></head><body><main class="wrap"><div class="box"><h1 class="gold">QR Business Page</h1><p class="note">Public Website-এর স্থায়ী URL এখানে বসিয়ে QR তৈরি করুন। QR-এর ভেতরে ফোন নম্বর নয়—Website URL থাকবে। তাই পরে Website-এর ছবি/তথ্য বদলালেও QR বদলাতে হবে না।</p><label>Public Page URL</label><input id="url" placeholder="https://your-site.example/" value=""><div class="actions"><button onclick="makeQR()">QR তৈরি করুন</button><button onclick="window.print()">প্রিন্ট / PDF</button></div><div id="qr" class="qr"></div><p id="status" class="note"></p><p><a href="./">← Public Page</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById('url').value.trim();const q=document.getElementById('qr');q.innerHTML='';if(!u){document.getElementById('status').textContent='আগে Public Page URL দিন।';return}new QRCode(q,{text:u,width:256,height:256});document.getElementById('status').textContent='QR তৈরি হয়েছে। এটি Banner, Visiting Card বা Sticker-এ ব্যবহার করতে পারবেন।'}</script></body></html>
